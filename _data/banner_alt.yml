# Alt text for the per-play resource banner images, keyed by the banner image
# file name (without path or extension). Used by the play/about layouts as a
# fallback when a page has no explicit `banner_alt` in its front matter.
# Keep each under 120 characters.
Mulan_ResourceBanner: "Mulan across adaptations: a warrior on a poster; an opera performer helmeted and unarmored; a woman in a headband."
OrphanZhao_ResourceBanner: "Collage from Orphan of Zhao adaptations: a floral pattern, Cheng Ying white-bearded in the middle, blue-robed at right."
Peony_RB_1: "Three-panel Peony Pavilion collage: a line-drawn woman, a Kunqu couple in a garden, and a red-robed woman by a railing."
Play_Zhang_RB: "Collage from Zhang Xie adaptations: the Water God Temple, two painted-face opera performers, a mural of robed figures."
TheLute_ResourceBanner: "Collage from The Lute adaptations: Cai Bojie in red, Zhao Wuniang in white with a pipa, a woodblock of the three leads."
WW_ResourceBanner: "Collage from West Wing adaptations: woodblock drawings of figures and scenes, and a color print of two women."
guan_resourcebanner: "Collage from Guan Hanqing adaptations: an execution-scene woodblock, a Snow in June film still, and Dou E in red robes."
